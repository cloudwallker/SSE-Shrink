[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sse-shrink"
version = "0.2.0"
description = "Shrink a broken LLM stream into a reproducible Python test."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sse", "llm", "debugging", "delta-debugging", "httpx", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.27,<0.29"]

[project.urls]
Repository = "https://github.com/cloudwallker/SSE-Shrink"
Issues = "https://github.com/cloudwallker/SSE-Shrink/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
sse-shrink = "sse_shrink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sse_shrink"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/benchmarks",
  "/scripts",
  "/docs/demo.svg",
  "/docs/performance.md",
  "/README.md",
  "/README.zh-CN.md",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: Bug report
description: Report a reproducible problem in SSE Shrink
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Shrinking is not redaction: do not attach streams, bundles, logs, or predicate output until you have removed any model text, personal data, credentials, internal URLs, and proprietary information.

  - type: input
    id: version
    attributes:
      label: SSE Shrink version or commit
      description: Use `python -m sse_shrink --version` or provide the commit ID.
      placeholder: 0.1.0 or commit ID
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.13.7
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11, macOS 15, etc.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and exit code
      description: Redact private paths and values. Do not include the stream body.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include content-free error text and report counts when relevant.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest synthetic SSE sample and predicate you are authorized to share, or explain why one is unavailable.
    validations:
      required: true

  - type: dropdown
    id: stability
    attributes:
      label: Does the predicate return the same answer on repeated runs?
      options:
        - "Yes"
        - "No"
        - "Unknown"
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed all pasted text and attachments and am authorized to share them publicly.
          required: true

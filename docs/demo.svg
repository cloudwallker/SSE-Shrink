<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">SSE Shrink: keep the failure, shrink the stream</title>
  <desc id="desc">A conceptual diagram: a noisy SSE capture is reduced by repeated predicate checks into a smaller offline Python reproduction. This illustration does not show measured performance.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1421"/><stop offset="1" stop-color="#12243a"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#6ee7b7"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6ee7b7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="480" rx="20" fill="url(#bg)"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect x="38" y="36" width="38" height="38" rx="10" fill="#123d40"/>
    <path d="M48 48h18M48 55h12M48 62h6" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="64" fill="#f1f5f9" font-size="27" font-weight="700">SSE Shrink</text>
    <text x="38" y="108" fill="#b7c9de" font-size="17">Turn a broken LLM stream into a reproducible Python test.</text>
    <rect x="38" y="143" width="338" height="245" rx="12" fill="#09131f" stroke="#29415b"/>
    <circle cx="59" cy="165" r="4" fill="#fb7185"/><circle cx="75" cy="165" r="4" fill="#fbbf24"/><circle cx="91" cy="165" r="4" fill="#6ee7b7"/>
    <text x="114" y="171" font-size="12" fill="#9db3cc">capture.sse</text>
    <path d="M39 184h336" stroke="#29415b"/>
    <text x="56" y="211" font-size="13" fill="#6c849e">: heartbeat</text>
    <text x="56" y="237" font-size="13" fill="#6c849e">data: {"delta":"hello"}</text>
    <rect x="49" y="251" width="315" height="26" rx="4" fill="#143e42"/>
    <text x="56" y="269" font-size="13" fill="#8ff0cf">event: target-state</text>
    <text x="56" y="302" font-size="13" fill="#6c849e">data: {"delta":"noise"}</text>
    <rect x="49" y="316" width="315" height="26" rx="4" fill="#143e42"/>
    <text x="56" y="334" font-size="13" fill="#8ff0cf">event: failure-trigger</text>
    <text x="56" y="367" font-size="13" fill="#6c849e">: more unrelated events ...</text>
    <path d="M400 265h54" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="469" y="212" width="184" height="105" rx="13" fill="#112f38" stroke="#388d89"/>
    <text x="561" y="241" text-anchor="middle" fill="#d5fff0" font-size="14">remove candidates</text>
    <text x="561" y="268" text-anchor="middle" fill="#91c8c0" font-size="13">re-run predicate</text>
    <text x="561" y="296" text-anchor="middle" fill="#6ee7b7" font-size="13">verify same failure</text>
    <path d="M678 265h53" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="753" y="143" width="329" height="245" rx="12" fill="#09131f" stroke="#29415b"/>
    <circle cx="774" cy="165" r="4" fill="#6ee7b7"/>
    <text x="791" y="171" font-size="12" fill="#9db3cc">reproduction bundle</text>
    <path d="M754 184h327" stroke="#29415b"/>
    <text x="773" y="214" font-size="13" fill="#8ff0cf">minimal.sse</text>
    <text x="783" y="241" font-size="12" fill="#b7c9de">event: target-state</text>
    <text x="783" y="266" font-size="12" fill="#b7c9de">event: failure-trigger</text>
    <path d="M773 284h287" stroke="#1f344b"/>
    <text x="773" y="310" font-size="13" fill="#8ff0cf">test_repro.py</text>
    <text x="773" y="337" font-size="13" fill="#8ff0cf">report.json</text>
    <text x="773" y="368" font-size="12" fill="#9db3cc">HTTPX replay · pytest</text>
    <rect x="38" y="417" width="6" height="17" rx="3" fill="url(#accent)"/>
    <text x="56" y="431" fill="#91adc5" font-size="12">LOCAL FILES</text>
    <text x="216" y="431" fill="#91adc5" font-size="12">NO MODEL KEY</text>
    <text x="388" y="431" fill="#91adc5" font-size="12">FAILURE-PRESERVING REDUCTION</text>
    <text x="1082" y="431" text-anchor="end" fill="#617c99" font-size="11">Concept illustration</text>
  </g>
</svg>
